<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | To-do Manager</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">Daily planner</p>
                <h1>TaskFlow</h1>
                <p class="subtitle">Keep small tasks moving forward.</p>
            </div>
            <div class="task-summary" aria-live="polite">
                <strong id="task-count">0</strong>
                <span>tasks left</span>
            </div>
        </header>

        <section class="task-panel" aria-labelledby="task-form-title">
            <h2 id="task-form-title">Add a task</h2>
            <form id="task-form" class="task-form">
                <label class="sr-only" for="task-input">Task name</label>
                <input id="task-input" name="task" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required>
                <label class="sr-only" for="schedule-input">Schedule date and time</label>
                <input id="schedule-input" name="schedule" type="datetime-local" aria-label="Schedule date and time">
                <button type="submit" class="primary-button">Add task</button>
            </form>
        </section>

        <section class="task-list-section" aria-labelledby="tasks-title">
            <div class="section-heading">
                <h2 id="tasks-title">Your tasks</h2>
                <div class="filters" role="group" aria-label="Filter tasks">
                    <button class="filter-button active" type="button" data-filter="all">All</button>
                    <button class="filter-button" type="button" data-filter="active">Active</button>
                    <button class="filter-button" type="button" data-filter="completed">Completed</button>
                </div>
            </div>
            <ul id="task-list" class="task-list" aria-live="polite"></ul>
            <p id="empty-state" class="empty-state">No tasks yet. Add one above to get started.</p>
        </section>
    </main>

    <template id="task-template">
        <li class="task-item">
            <label class="task-content">
                <input class="task-checkbox" type="checkbox">
                <span class="task-details">
                    <span class="task-text"></span>
                    <time class="task-schedule"></time>
                </span>
            </label>
            <div class="task-actions">
                <button class="icon-button edit-button" type="button" aria-label="Edit task" title="Edit task">Edit</button>
                <button class="icon-button delete-button" type="button" aria-label="Delete task" title="Delete task">Delete</button>
            </div>
        </li>
    </template>

    <script src="todo.js"></script>
</body>
</html>
